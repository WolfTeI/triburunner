name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permisos requeridos para desplegar a GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite un solo despliegue concurrente a la vez
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm ci

      - name: Compilar Proyecto Angular para GitHub Pages (Subdominio Personalizado)
        run: |
          npm run build -- --base-href /
          cp dist/TribuRunnerWeb/browser/index.html dist/TribuRunnerWeb/browser/404.html
          echo "triburunner.wolftei.com.ar" > dist/TribuRunnerWeb/browser/CNAME

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir Artefacto para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/TribuRunnerWeb/browser'

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
